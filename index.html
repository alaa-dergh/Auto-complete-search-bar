<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autocomplete Search</title>
<style>
  :root { --bg:#f6f7fb; --fg:#1b1f2a; --muted:#6b7280; --accent:#2563eb; --card:#fff; --border:#d9dde7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --fg:#e8eaf0; --muted:#9aa1b0; --accent:#6ea0ff; --card:#1b1e27; --border:#2d3240; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:16px/1.4 system-ui, sans-serif; display:flex; justify-content:center; padding:12vh 16px 0; }
  main { width:100%; max-width:520px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .box { position:relative; }
  input { width:100%; padding:14px 16px; font:inherit; color:inherit; background:var(--card);
          border:1px solid var(--border); border-radius:12px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  ul { list-style:none; margin:6px 0 0; padding:4px; position:absolute; left:0; right:0; z-index:10;
       background:var(--card); border:1px solid var(--border); border-radius:12px;
       box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:320px; overflow:auto; }
  ul[hidden] { display:none; }
  li { padding:10px 12px; border-radius:8px; cursor:pointer; }
  li[aria-selected="true"] { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  li mark { background:none; color:var(--accent); font-weight:700; }
  .empty { color:var(--muted); cursor:default; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>Search</h1>
  <div class="box">
    <input id="q" type="search" placeholder="Try “land”, “cote d'ivoire”, “turkiye”…"
           role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list"
           autocomplete="off" spellcheck="false">
    <ul id="list" role="listbox" hidden></ul>
  </div>
  <p class="hint">Mid-word matches, accent- and apostrophe-insensitive. Use ↑ ↓ Enter Esc.</p>
</main>

<script src="data.js"></script>
<script src="search.js"></script>
<script>
(function () {
  const input = document.getElementById("q");
  const list = document.getElementById("list");
  const search = Autocomplete.createSearch(data, { limit: 10 });
  let results = [], active = -1;

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function render() {
    list.innerHTML = "";
    if (!input.value.trim()) return close();
    if (!results.length) {
      list.innerHTML = '<li class="empty">No results</li>';
    } else {
      results.forEach((r, i) => {
        const [s, e] = r.range;
        const li = document.createElement("li");
        li.id = "opt-" + i;
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", i === active);
        li.innerHTML = esc(r.label.slice(0, s)) + "<mark>" + esc(r.label.slice(s, e)) + "</mark>" + esc(r.label.slice(e));
        li.addEventListener("mousedown", (ev) => { ev.preventDefault(); choose(i); });
        list.appendChild(li);
      });
    }
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
  }

  function close() { list.hidden = true; active = -1; input.setAttribute("aria-expanded", "false"); }
  function choose(i) { input.value = results[i].label; close(); }
  function setActive(i) {
    active = (i + results.length) % results.length;
    [...list.children].forEach((li, j) => li.setAttribute("aria-selected", j === active));
    list.children[active].scrollIntoView({ block: "nearest" });
    input.setAttribute("aria-activedescendant", "opt-" + active);
  }

  input.addEventListener("input", () => { results = search(input.value); active = -1; render(); });
  input.addEventListener("focus", () => { if (input.value) { results = search(input.value); render(); } });
  input.addEventListener("blur", close);
  input.addEventListener("keydown", (e) => {
    if (list.hidden || !results.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); choose(active); }
    else if (e.key === "Escape") close();
  });
})();
</script>
</body>
</html>
